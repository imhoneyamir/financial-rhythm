name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Copy Built Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Accept Android Licenses & SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Assemble Debug APK
        run: |
          cd android
          if ! ./gradlew :app:assembleDebug --stacktrace > build.log 2>&1; then
            echo "::error::Gradle failed! What went wrong:"
            grep -A 10 "* What went wrong:" build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::Caused by:"
            grep -m 3 -A 4 "Caused by:" build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Copy APK to Output
        run: |
          mkdir -p output
          find android -name "*.apk" -ls -exec cp {} output/app-debug.apk \;
          ls -lh output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-rhythm-app-debug
          path: output/app-debug.apk
