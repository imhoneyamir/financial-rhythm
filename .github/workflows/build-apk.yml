name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Copy Built Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Print & Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-rhythm-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
